<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Volúmenes - Geometría 3D</title>
    <style>
        /* Variables con la paleta de colores requerida */
        :root {
            --negro: #120A12;
            --purpura-oscuro: #2A0835;
            --violeta: #5C1369;
            --lila: #A155B9;
            --lila-claro: #E1BEE7;
            --blanco: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--negro);
            color: var(--blanco);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--lila-claro);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(161, 85, 185, 0.5);
        }

        header p {
            color: var(--lila);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }

        .card {
            background: linear-gradient(145deg, var(--purpura-oscuro), var(--negro));
            border: 2px solid var(--violeta);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--lila-claro);
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--violeta);
            background-color: #1a0f24;
            color: var(--blanco);
            font-size: 1rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--lila);
            box-shadow: 0 0 8px var(--lila);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--violeta);
            color: var(--blanco);
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--lila);
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(92, 19, 105, 0.2);
            border-left: 4px solid var(--lila);
            border-radius: 4px;
            text-align: center;
        }

        .result-box h3 {
            color: var(--lila-claro);
            font-size: 1.1rem;
        }

        .result-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--blanco);
            margin-top: 5px;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background-color: #180a1d;
            border: 2px solid var(--violeta);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(92, 19, 105, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Calculadora de Volúmenes 3D</h1>
        <p>Aplica matemáticas y previsualiza la figura en tiempo real</p>
    </header>

    <div class="container">
        <!-- Panel de Controles -->
        <div class="card">
            <div class="form-group">
                <label for="shapeSelect">Selecciona la figura:</label>
                <select id="shapeSelect" onchange="updateForm()">
                    <option value="sphere">Esfera</option>
                    <option value="cylinder">Cilindro</option>
                    <option value="cube">Cubo</option>
                    <option value="cone">Cono</option>
                </select>
            </div>

            <!-- Campos dinámicos -->
            <div id="inputsContainer">
                <!-- Se llenan con JavaScript -->
            </div>

            <button onclick="calculateVolume()">Calcular Volumen</button>

            <div class="result-box">
                <h3>Volumen Calculado:</h3>
                <span id="resultValue">0.00 u³</span>
            </div>
        </div>

        <!-- Panel de Visualización / Gráfica -->
        <div class="card canvas-container">
            <h2 style="color: var(--lila-claro); margin-bottom: 15px;">Representación Gráfica</h2>
            <canvas id="geometryCanvas" width="300" height="280"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        let currentShape = 'sphere';
        let angle = 0; // Para animación continua

        // Inicializar
        updateForm();

        // Cambiar inputs según la figura
        function updateForm() {
            currentShape = document.getElementById('shapeSelect').value;
            const container = document.getElementById('inputsContainer');
            container.innerHTML = '';

            if (currentShape === 'sphere') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>Radio (r):</label>
                        <input type="number" id="radio" value="5" min="0" step="any">
                    </div>
                `;
            } else if (currentShape === 'cylinder' || currentShape === 'cone') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>Radio (r):</label>
                        <input type="number" id="radio" value="5" min="0" step="any">
                    </div>
                    <div class="form-group">
                        <label>Altura (h):</label>
                        <input type="number" id="height" value="10" min="0" step="any">
                    </div>
                `;
            } else if (currentShape === 'cube') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>Lado / Arista (a):</label>
                        <input type="number" id="side" value="5" min="0" step="any">
                    </div>
                `;
            }
            calculateVolume();
        }

        // Cálculo del Volumen
        function calculateVolume() {
            let volume = 0;

            if (currentShape === 'sphere') {
                const r = parseFloat(document.getElementById('radio').value) || 0;
                volume = (4 / 3) * Math.PI * Math.pow(r, 3);
            } else if (currentShape === 'cylinder') {
                const r = parseFloat(document.getElementById('radio').value) || 0;
                const h = parseFloat(document.getElementById('height').value) || 0;
                volume = Math.PI * Math.pow(r, 2) * h;
            } else if (currentShape === 'cone') {
                const r = parseFloat(document.getElementById('radio').value) || 0;
                const h = parseFloat(document.getElementById('height').value) || 0;
                volume = (1 / 3) * Math.PI * Math.pow(r, 2) * h;
            } else if (currentShape === 'cube') {
                const a = parseFloat(document.getElementById('side').value) || 0;
                volume = Math.pow(a, 3);
            }

            document.getElementById('resultValue').innerText = volume.toFixed(2) + " u³";
        }

        // Bucle de Renderizado para Renderizar y Animar Gráficos
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.strokeStyle = '#E1BEE7';
            ctx.fillStyle = '#5C1369';
            ctx.lineWidth = 2;

            if (currentShape === 'sphere') {
                // Esfera
                ctx.beginPath();
                ctx.arc(cx, cy, 70, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Línea ecuatorial perspectiva 3D
                ctx.beginPath();
                ctx.ellipse(cx, cy, 70, 25, 0, 0, Math.PI * 2);
                ctx.strokeStyle = '#A155B9';
                ctx.stroke();

            } else if (currentShape === 'cylinder') {
                // Cilindro
                const w = 100, h = 120;
                ctx.fillRect(cx - w/2, cy - h/2, w, h);
                ctx.strokeRect(cx - w/2, cy - h/2, w, h);

                // Tapas
                ctx.beginPath();
                ctx.ellipse(cx, cy - h/2, w/2, 20, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#A155B9';
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(cx, cy + h/2, w/2, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

            } else if (currentShape === 'cube') {
                // Cubo (Animación con rotación simple en falso 3D)
                const size = 80;
                ctx.save();
                ctx.translate(cx, cy);

                // Cara frontal
                ctx.fillRect(-size/2, -size/2, size, size);
                ctx.strokeRect(-size/2, -size/2, size, size);

                // Cara trasera (Perspectiva)
                ctx.fillStyle = '#A155B9';
                ctx.strokeRect(-size/4, -size/4 - 20, size, size);
                
                // Conectar vértices
                ctx.beginPath();
                ctx.moveTo(-size/2, -size/2); ctx.lineTo(-size/4, -size/4 - 20);
                ctx.moveTo(size/2, -size/2); ctx.lineTo(size/4, -size/4 - 20);
                ctx.moveTo(-size/2, size/2); ctx.lineTo(-size/4, size/4 - 20);
                ctx.moveTo(size/2, size/2); ctx.lineTo(size/4, size/4 - 20);
                ctx.stroke();

                ctx.restore();

            } else if (currentShape === 'cone') {
                // Cono
                const w = 120, h = 130;
                ctx.beginPath();
                ctx.moveTo(cx, cy - h/2);
                ctx.lineTo(cx - w/2, cy + h/2);
                ctx.lineTo(cx + w/2, cy + h/2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Base
                ctx.beginPath();
                ctx.ellipse(cx, cy + h/2, w/2, 20, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#A155B9';
                ctx.fill();
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
